name: node-blog

services:
  db:
    image: mysql:8.4
    env_file: .env.db
    volumes:
      - db-data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    ports:
      - "127.0.0.1:3307:3306"
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - -h
        - 127.0.0.1
        - --silent
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  api:
    build: .
    env_file: .env.docker
    volumes:
      - uploads-data:/app/uploads
    environment:
      DB_HOST: db
      DB_PORT: "3306"
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads-data:/srv/uploads:ro
    depends_on:
      - api

volumes:
  db-data:
  uploads-data:

server {
  client_max_body_size 3m;

  listen 80;
  server_name _;

  error_page 413 = @json413;
  error_page 404 = @json404;
  error_page 502 504 = @json502;

  location @json502 {
    default_type application/json;
    return 502 '{"success":false,"error":{"code":"UPSTREAM_UNAVAILABLE","message":"Servis su anda yanit veremiyor."}}';
  }

  location @json413 {
    default_type application/json;
    return 413 '{"success":false,"error":{"code":"PAYLOAD_TOO_LARGE","message":"Istek govdesi cok buyuk."}}';
  }

  location @json404 {
    types { }
    default_type application/json;
    return 404 '{"success":false,"error":{"code":"NOT_FOUND","message":"Kaynak bulunamadi."}}';
  }

  location /uploads/ {
    alias /srv/uploads/;
    access_log off;
    expires 7d;
    try_files $uri =404;
  }

  location / {
    proxy_pass http://api:3000;
    proxy_connect_timeout 3s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
